name: Android Build and Safety Tests
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check source integrity
        run: python3 scripts/check_source_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure optional persistent QA signing
        env:
          QA_DEBUG_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.QA_DEBUG_KEYSTORE_BASE64 || '' }}
        run: python3 scripts/configure_qa_signing.py --report qa-signing.json
      - name: Measure verified baseline APK
        if: github.job == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38682222910 --repo "${{ github.repository }}" --name AIMediaSorter-debug-apk --dir baseline-apk
          mkdir -p size-reports
          python3 scripts/measure_apk.py baseline-apk/app-debug.apk size-reports/baseline-size.json
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only baseline-apk/app-debug.apk > baseline-dex-packages.txt
      - name: Install decoder fixture generator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Generate isolated decoder fixture
        run: python3 scripts/generate_test_media.py
      - name: Verify standalone transfer executor
        run: python3 -m unittest discover -s tests -v
      - name: Clean build, unit tests, lint and instrumentation compilation
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Summarize executed JVM tests
        run: python3 scripts/summarize_junit.py app/build/test-results/testDebugUnitTest app/build/reports/jvm-summary.json
      - name: Inspect generated APK
        run: python3 scripts/inspect_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Measure current debug APK
        run: |
          python3 scripts/measure_apk.py app/build/outputs/apk/debug/app-debug.apk app/build/reports/current-size.json
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only app/build/outputs/apk/debug/app-debug.apk > current-dex-packages.txt
      - name: Build ARMv7 and ARM64 APKs for testing only
        run: |
          mkdir -p optimized-apks
          cp app/build/outputs/apk/debug/app-debug.apk optimized-apks/optimized-arm64-v8a-debug.apk
          ./gradlew assembleRelease -PqaReleaseSigning=true -PtargetAbi=arm64-v8a --stacktrace
          cp app/build/outputs/apk/release/app-release.apk optimized-apks/optimized-arm64-v8a-release-QA.apk
          ./gradlew assembleDebug assembleRelease -PqaReleaseSigning=true -PtargetAbi=armeabi-v7a --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk optimized-apks/optimized-armeabi-v7a-debug.apk
          cp app/build/outputs/apk/release/app-release.apk optimized-apks/optimized-armeabi-v7a-release-QA.apk
          for apk in optimized-apks/*.apk; do
            python3 scripts/measure_apk.py "$apk" "app/build/reports/$(basename "$apk" .apk)-size.json"
            python3 scripts/inspect_apk.py "$apk"
          done
          python3 scripts/verify_optimized_apks.py
          python3 -c 'import pathlib; names={"<TOTAL>","kotlin","kotlinx","androidx.compose","androidx.room","androidx.work","ai.onnxruntime","com.google.mlkit","com.google.android.gms"}; print("\n".join(l for l in pathlib.Path("baseline-dex-packages.txt").read_text().splitlines() if l.lstrip().startswith("P ") and l.split()[-1] in names))'
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-APKs-QA-only
          path: optimized-apks/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIMediaSorter-arm64-v8a-release-QA
          path: optimized-apks/optimized-arm64-v8a-release-QA.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIMediaSorter-armeabi-v7a-release-QA
          path: optimized-apks/optimized-armeabi-v7a-release-QA.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AIMediaSorter-debug-apk
          path: optimized-apks/*-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/*-summary.json
            app/build/reports/lint-results-debug.*
            app/build/reports/*-inspection.json
            app/build/reports/*-size.json
            *-dex-packages.txt
            size-reports/*.json
            qa-signing.json
  android-device-tests:
    # These jobs compile their own test APKs and consume no build-job artifacts.
    # Run independently so emulator verification and distributable APK builds overlap.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: default
            label: '34'
            page_size: 4096
            variant: debug
          - api: 35
            target: default
            label: '35'
            page_size: 4096
            variant: debug
          - api: 35
            target: google_apis_ps16k
            label: '35-16kb'
            page_size: 16384
            variant: debug
          - api: 34
            target: default
            label: '34-release'
            page_size: 4096
            variant: release
          - api: 35
            target: google_apis_ps16k
            label: '35-16kb-release'
            page_size: 16384
            variant: release
          - api: 36
            target: google_apis_ps16k
            label: '36-16kb'
            page_size: 16384
            variant: debug
          - api: 36
            target: google_apis_ps16k
            label: '36-16kb-release'
            page_size: 16384
            variant: release
    steps:
      - uses: actions/checkout@v4
      - name: Check source integrity
        run: python3 scripts/check_source_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure optional persistent QA signing
        env:
          QA_DEBUG_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.QA_DEBUG_KEYSTORE_BASE64 || '' }}
        run: python3 scripts/configure_qa_signing.py --report qa-signing.json
      - name: Install decoder fixture generator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Generate isolated decoder fixture
        run: python3 scripts/generate_test_media.py
      - name: Enable runner KVM access
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_native_tests.sh "${{ matrix.variant }}" "${{ matrix.page_size }}"
      - name: Capture test logcat
        if: always()
        run: |
          timeout 20s adb logcat -d > android-test-logcat.txt || true
          if [ "${{ job.status }}" != "success" ]; then tail -n 300 android-test-logcat.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports-api-${{ matrix.label }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/native-summary.json
            app/build/outputs/androidTest-results/
            android-test-logcat.txt
            android-crash-logcat.txt
            android-runtime-diagnostics.txt
            qa-signing.json
            qa-coinstall-smoke.json
